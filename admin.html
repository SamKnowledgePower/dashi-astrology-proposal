<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>達氏占星宇宙｜進度管理後台</title><style>
:root{--bg:#f3f1ec;--paper:#fff;--ink:#19181d;--muted:#74717b;--line:#ddd9d1;--violet:#6754a5;--green:#2f7659;--red:#a43c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang TC",Arial,sans-serif;line-height:1.55}.wrap{width:min(1080px,calc(100% - 30px));margin:auto}header{background:#191620;color:#fff;padding:30px 0}h1{margin:0;font-size:30px}.sub{color:#bbb4c5;margin:5px 0 0}.panel{background:var(--paper);border:1px solid var(--line);padding:24px;margin-top:20px}.hidden{display:none!important}label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;padding:10px;font:inherit}textarea{min-height:82px;resize:vertical}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{display:inline-flex;border:0;background:var(--violet);color:#fff;padding:11px 16px;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--red)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.notice{padding:12px;background:#fff2d8;color:#875a13;margin-top:16px}.month{margin-top:12px;border:1px solid var(--line);background:#fff}.month summary{padding:17px;font-weight:800;cursor:pointer}.month-body{border-top:1px solid var(--line);padding:14px}.task{border:1px solid var(--line);padding:14px;margin-bottom:10px}.task-head{display:grid;grid-template-columns:1fr 150px 140px;gap:10px;align-items:end}.links{margin-top:10px}.link-row{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;margin-top:7px}.remove{border:0;background:#f7e6e8;color:var(--red);padding:8px;cursor:pointer}.add-link{margin-top:8px;border:1px dashed var(--line);background:#fff;padding:7px 10px;cursor:pointer}.savebar{position:sticky;bottom:0;background:rgba(243,241,236,.94);border-top:1px solid var(--line);padding:14px 0;margin-top:24px;backdrop-filter:blur(10px)}#message{font-size:13px;margin-left:10px}@media(max-width:720px){.grid3,.task-head,.link-row{grid-template-columns:1fr}.savebar .actions{align-items:stretch}.btn{justify-content:center}}
</style></head><body><header><div class="wrap"><h1>進度管理後台</h1><p class="sub">達氏占星宇宙｜每週成果與連結發布</p></div></header><main class="wrap"><section id="setup" class="panel hidden"><h2>尚未連接雲端資料庫</h2><p>管理介面已完成。填入 Supabase 專案網址與公開金鑰後，即可登入並發布給客戶查看。</p></section><section id="login" class="panel hidden"><h2>管理員登入</h2><p>系統會寄送安全登入連結至管理員信箱。</p><div style="max-width:420px"><label>電子郵件</label><input id="email" type="email"><div class="actions"><button class="btn" id="send-login">寄送登入連結</button><a class="btn secondary" href="progress.html" target="_blank">查看公開進度</a></div></div><p id="login-message"></p></section><section id="editor" class="hidden"><div class="panel"><div class="grid3"><div><label>專案狀態</label><input id="status"></div><div><label>目前月份</label><select id="current-month"></select></div><div><label>最近更新日期</label><input id="updated" type="date"></div></div><div class="grid3" style="margin-top:16px"><div><label>本週完成（每行一項）</label><textarea id="weekly-done"></textarea></div><div><label>等待客戶確認（每行一項）</label><textarea id="weekly-wait"></textarea></div><div><label>下一步安排（每行一項）</label><textarea id="weekly-next"></textarea></div></div></div><div id="months"></div><div class="savebar"><div class="wrap actions"><button class="btn" id="publish">發布更新</button><button class="btn secondary" id="logout">登出</button><a class="btn secondary" href="progress.html" target="_blank">查看客戶頁面</a><span id="message"></span></div></div></section></main><script src="progress-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
