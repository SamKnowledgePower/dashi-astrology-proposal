<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>達氏占星宇宙｜執行進度儀表板</title><meta name="description" content="達氏占星宇宙一年期事業共建專案每週執行進度"><style>
:root{--bg:#f3f1ec;--paper:#fff;--ink:#17171a;--muted:#74747c;--line:#dedbd3;--violet:#6754a5;--violet-soft:#eee9ff;--cyan:#167684;--green:#2f7659;--green-soft:#e7f4ed;--amber:#9a6515;--amber-soft:#fff3d9;--shadow:0 8px 32px rgba(24,20,40,.06)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif;line-height:1.6}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{background:#18151f;color:#fff;padding:54px 0 48px;position:relative;overflow:hidden}header:after{content:"";position:absolute;inset:-50%;background:radial-gradient(circle at 70% 35%,rgba(143,116,232,.28),transparent 24%);pointer-events:none}.eyebrow{font:700 11px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:.15em;color:#bfb0f6;text-transform:uppercase}.header-grid{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;position:relative;z-index:1}h1{font-size:clamp(35px,5.8vw,66px);line-height:1.08;letter-spacing:-.04em;margin:12px 0 12px}.subtitle{color:#c8c4ce;margin:0}.header-meta{text-align:right;color:#c8c4ce;font-size:13px}.header-meta strong{display:block;color:#fff;font-size:20px}.status-line{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 12px;border:1px solid rgba(255,255,255,.18);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#b8a7ff;box-shadow:0 0 12px #b8a7ff}.main{padding:36px 0 72px}.section-label{font-size:13px;font-weight:800;margin:0 0 14px}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:28px}.metric{background:var(--paper);border:1px solid var(--line);padding:18px 16px;box-shadow:var(--shadow)}.metric strong{font-size:25px;display:block;letter-spacing:-.035em}.metric span{color:var(--muted);font-size:12px}.bar{height:4px;background:#ece9e3;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#9d87e9);width:var(--p)}.week-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-bottom:38px}.week-card{background:var(--paper);border:1px solid var(--line);padding:20px;min-height:150px}.week-card h2{font-size:15px;margin:0 0 12px}.week-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}.week-card li+li{margin-top:6px}.week-card.done{border-top:3px solid var(--green)}.week-card.wait{border-top:3px solid var(--amber)}.week-card.next{border-top:3px solid var(--violet)}.months{display:grid;gap:10px}.month{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}.month[open]{border-color:#b8afd0}.month summary{list-style:none;display:grid;grid-template-columns:72px minmax(190px,.8fr) 1.3fr auto 22px;gap:18px;align-items:center;padding:19px 22px;cursor:pointer}.month summary::-webkit-details-marker{display:none}.month-num{font-size:28px;font-weight:800;line-height:1}.month-num small{display:block;color:var(--muted);font-size:9px;letter-spacing:.15em;margin-top:5px}.month-title{font-weight:800}.month-focus{color:var(--muted);font-size:13px}.month-progress{font:700 12px ui-monospace,monospace;white-space:nowrap}.chev{color:var(--violet);transition:.2s}.month[open] .chev{transform:rotate(90deg)}.month-body{border-top:1px solid var(--line);padding:8px 22px 22px}.task{display:grid;grid-template-columns:24px minmax(170px,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eceae5}.task:last-child{border-bottom:0}.check{width:18px;height:18px;border:1.5px solid #aaa5b1;border-radius:3px;display:grid;place-items:center;font-size:12px;color:#fff}.task.complete .check{background:var(--green);border-color:var(--green)}.task.complete .check:after{content:"✓"}.task-name{font-size:14px}.task.complete .task-name{color:#777;text-decoration:line-through}.task-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.task-links a{font-size:11px;text-decoration:none;color:var(--violet);background:var(--violet-soft);padding:5px 8px;border-radius:3px}.task-state{font-size:11px;padding:4px 8px;border-radius:20px;background:#eee;color:#777}.task-state.review{background:var(--amber-soft);color:var(--amber)}.task-state.active{background:var(--violet-soft);color:var(--violet)}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:16px 0 0}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}.legend .l-active:before{background:var(--violet)}.legend .l-review:before{background:var(--amber)}.legend .l-done:before{background:var(--green)}.footer-note{margin-top:34px;padding:20px;border-left:3px solid var(--violet);background:#ece9e3;color:var(--muted);font-size:13px}.back{display:inline-block;margin-top:22px;color:var(--ink);font-weight:700;text-decoration:none}@media(max-width:850px){.summary{grid-template-columns:repeat(3,1fr)}.week-grid{grid-template-columns:1fr}.month summary{grid-template-columns:55px 1fr auto 18px}.month-focus{grid-column:2/5}.header-grid{grid-template-columns:1fr}.header-meta{text-align:left}}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.month summary{padding:16px}.month-body{padding:6px 16px 18px}.task{grid-template-columns:22px 1fr}.task-links,.task-state{grid-column:2;justify-content:flex-start}.metric strong{font-size:21px}}
</style></head><body><header><div class="wrap header-grid"><div><div class="eyebrow">Sam Knowledge Power × 達氏占星宇宙</div><h1>執行進度儀表板</h1><p class="subtitle">占星塔羅一年期事業共建與變現計畫</p><div class="status-line"><span class="dot"></span><span id="project-status">提案階段｜尚未啟動</span></div></div><div class="header-meta">最近更新<strong id="updated-at">2026-08-05</strong>目前進度：第 <b id="current-month">0</b> 個月</div></div></header><main class="main"><div class="wrap"><p class="section-label">數量進度總覽</p><section class="summary" id="metrics"></section><p class="section-label">每週進度摘要</p><section class="week-grid"><article class="week-card done"><h2>本週完成</h2><ul id="weekly-done"><li>專案尚未啟動</li></ul></article><article class="week-card wait"><h2>等待客戶確認</h2><ul id="weekly-wait"><li>確認合作與正式啟動日</li></ul></article><article class="week-card next"><h2>下一步安排</h2><ul id="weekly-next"><li>簽署契約與安排啟動訪談</li><li>建立社群與名單數據基線</li></ul></article></section><p class="section-label">逐月交付明細</p><section class="months" id="months"></section><div class="legend"><span class="l-done">已完成</span><span class="l-active">進行中</span><span class="l-review">等待確認</span><span>尚未開始</span></div><div class="footer-note">本頁是雙方共同查閱的公開進度依據。每週更新完成項目、成果連結、等待確認事項與下一步；客戶重新整理同一網址即可看到最新版。</div><a class="back" href="index.html#documents">← 返回合作提案</a></div></main><script src="progress-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{
let project={updated:"2026-08-05",currentMonth:0,status:"提案階段｜尚未啟動",counts:{shorts:0,posts:0,seo:0,youtube:0,podcast:0,course:0},weekly:{done:["專案尚未啟動"],wait:["確認合作與正式啟動日"],next:["簽署契約與安排啟動訪談","建立社群與名單數據基線"]},tasks:{}};
const cfg=window.PROGRESS_CONFIG||{};
const projectSlug=new URLSearchParams(location.search).get('project')||cfg.projectId;
if(cfg.supabaseUrl&&cfg.supabaseAnonKey){try{const db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const result=await db.rpc('get_public_progress',{project_slug:projectSlug});const row=Array.isArray(result.data)?result.data[0]:result.data;if(row?.data)project={...project,...row.data};if(row?.name){document.title=`${row.name}｜執行進度儀表板`;document.querySelector('.eyebrow').textContent=`Sam Knowledge Power × ${row.name}`}}catch(error){console.warn('Using proposal progress fallback',error)}}
const phases=[
 [1,"啟動與定位假設","品牌訪談、案例盤點、數據基線",["合作啟動會議與年度排程","達達老師專業與品牌訪談","既有案例及高頻問題盤點","競品與市場初步研究"]],
 [2,"內容測試與客群觀察","第一輪主題測試、既有客戶訪談",["內容支柱與測試題目定案","既有客戶訪談第一輪","社群平台與 LINE 基線建立"]],
 [3,"第一季檢討與定位校準","比較內容訊號與客戶語言",["第一季內容數據檢討","高反應問題與客群整理","定位假設第一次校準"]],
 [4,"服務實驗啟動","年度解盤或小型 MVP 設計",["MVP 服務架構與流程","招募測試客戶","專業判讀邊界初稿"]],
 [5,"案例與方法萃取","從真實服務整理方法論",["MVP 執行與客戶回饋","案例去識別化整理","品牌方法論初稿"]],
 [6,"網站與搜尋資產","品牌網站、SEO 主題與半年檢討",["品牌測試網站上線","SEO 主題與關鍵字規劃","半年市場驗證報告"]],
 [7,"課程需求驗證","課程利基候選與候補名單",["課程利基候選比較","候補名單頁與名單磁鐵","課程承諾測試"]],
 [8,"課程方向定版","依證據確認正式課程",["課程方向與目標客群定案","課程章節與學習成果","製課拍攝前置"]],
 [9,"正式製課啟動","腳本、銷售頁與拍攝準備",["課程腳本協作","銷售頁架構初稿","課程拍攝第一階段"]],
 [10,"課程製作與系統建置","拍攝、剪輯、金流與交付",["課程拍攝第二階段","課程影片剪輯與上架","金流與權限流程串接"]],
 [11,"首航準備與測試交易","銷售頁優化、招生暖身",["銷售頁正式版","測試交易與自動交付","候補名單招生暖身"]],
 [12,"正式上線與年度總結","首航、回饋、交接與第二年方向",["課程正式上線","首批學員回饋與 FAQ","全年成果與資產交接","第二年營運建議"]]
];
const recurring=m=>[`短影音 第 ${(m-1)*4+1}–${m*4} 支`,`社群文章 第 ${(m-1)*4+1}–${m*4} 篇`,`每月共創討論與集中拍攝`];
const extras={3:["YouTube 旗艦長片 第 1 支"],4:["Bonus Podcast 第 1 集"],5:["SEO 專題 第 1 篇","Bonus Podcast 第 2 集"],6:["SEO 專題 第 2 篇","YouTube 旗艦長片 第 2 支"],7:["SEO 專題 第 3 篇","Bonus Podcast 第 3 集"],8:["SEO 專題 第 4 篇","YouTube 旗艦長片 第 3 支"],9:["Bonus Podcast 第 4 集"],10:["SEO 專題 第 5 篇","Bonus Podcast 第 5 集"],11:["YouTube 旗艦長片 第 4 支"],12:["SEO 專題 第 6 篇","Bonus Podcast 第 6 集"]};
const metricDefs=[["短影音","shorts",48],["社群文章","posts",48],["SEO 專題","seo",6],["YouTube","youtube",4],["Bonus Podcast","podcast",6],["正式課程","course",1]];
const taskRecords=Object.values(project.tasks||{});const completed=taskRecords.filter(t=>t.status==='complete');project.counts={shorts:completed.filter(t=>t.name.startsWith('短影音')).length*4,posts:completed.filter(t=>t.name.startsWith('社群文章')).length*4,seo:completed.filter(t=>t.name.startsWith('SEO 專題')).length,youtube:completed.filter(t=>t.name.startsWith('YouTube')).length,podcast:completed.filter(t=>t.name.startsWith('Bonus Podcast')).length,course:completed.some(t=>t.name==='課程正式上線')?1:0};
const stateLabel={todo:'尚未開始',active:'進行中',review:'等待確認',complete:'已完成'};
const renderTask=name=>{const t=taskRecords.find(x=>x.name===name)||{name,status:'todo',date:'',note:'',links:[]};const links=(t.links||[]).filter(x=>x.url).map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.label||'查看成果'} ↗</a>`).join('');return `<div class="task ${t.status==='complete'?'complete':''}"><span class="check"></span><span class="task-name">${t.name}${t.date?`<small style="display:block;color:#999">${t.date}</small>`:''}${t.note?`<small style="display:block;color:#777;text-decoration:none">${t.note}</small>`:''}</span><span class="task-links"><span class="task-state ${t.status}">${stateLabel[t.status]||stateLabel.todo}</span>${links}</span></div>`};
document.querySelector('#updated-at').textContent=project.updated;document.querySelector('#current-month').textContent=project.currentMonth;document.querySelector('#project-status').textContent=project.status;
document.querySelector('#metrics').innerHTML=metricDefs.map(([label,key,total])=>{const n=project.counts[key],p=Math.min(100,n/total*100);return `<article class="metric"><strong>${n} / ${total}</strong><span>${label}</span><div class="bar"><i style="--p:${p}%"></i></div></article>`}).join('');
for(const key of ["done","wait","next"]){document.querySelector(`#weekly-${key}`).innerHTML=project.weekly[key].map(x=>`<li>${x}</li>`).join('')}
document.querySelector('#months').innerHTML=phases.map(([m,title,focus,special])=>{const tasks=[...special,...recurring(m),...(extras[m]||[])];const done=tasks.filter(name=>taskRecords.find(x=>x.name===name)?.status==='complete').length;return `<details class="month" ${project.currentMonth===m?'open':''}><summary><div class="month-num">${String(m).padStart(2,'0')}<small>MONTH</small></div><div class="month-title">${title}</div><div class="month-focus">${focus}</div><div class="month-progress">${done} / ${tasks.length}</div><div class="chev">▶</div></summary><div class="month-body">${tasks.map(renderTask).join('')}</div></details>`}).join('');
})();
</script></body></html>
